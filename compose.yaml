services:
  phoenix:
    image: arizephoenix/phoenix:version-17.5.0
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data

  oracle:
    image: gvenzl/oracle-free:23-faststart
    container_name: swiss-travel-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${LOCAL_ORACLE_PASSWORD:-LocalDemoPassword1}
      APP_USER: TRAVEL
      APP_USER_PASSWORD: ${LOCAL_ORACLE_PASSWORD:-LocalDemoPassword1}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  phoenix-data:
  oracle-data:
