micronaut.application.name=swiss-travel-advisor

# Serve the zero-build chat interface from the application root.
micronaut.router.static-resources.ui.mapping=/**
micronaut.router.static-resources.ui.paths=classpath:public

# Preferred demo setup: share the same Oracle ADB environment variables as
# ../pet-vector-search. Micronaut-native DATASOURCES_DEFAULT_* environment
# variables still override these application defaults when present.
datasources.default.db-type=oracle
datasources.default.dialect=ORACLE
datasources.default.driverClassName=oracle.jdbc.OracleDriver
datasources.default.url=${ORACLE_JDBC_URL:}
datasources.default.username=${DB_USERNAME:ADMIN}
datasources.default.password=${DB_PASSWORD:}

# Keep the conference demo pool small and replace stale Oracle connections
# before the next audience request discovers them.
datasources.default.maximum-pool-size=5
datasources.default.minimum-idle=1
datasources.default.connection-timeout=10000
datasources.default.validation-timeout=5000
datasources.default.idle-timeout=300000
datasources.default.keepalive-time=120000
datasources.default.max-lifetime=600000

flyway.datasources.default.enabled=true
flyway.datasources.default.validate-on-migrate=false

# Persist a bounded conversation window in Oracle instead of process memory.
langchain4j.chat-memory-store.inmemory.enabled=false
langchain4j.chat-memory-store.message-window.max-messages=20
app.chat-memory.oracle.table-name=CHAT_MEMORY
app.chat-memory.oracle.memory-id-column-name=MEMORY_ID
app.chat-memory.oracle.content-column-name=CONTENT

langchain4j.open-ai.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://api.openai.com/v1
langchain4j.open-ai.chat-model.model-name=${OPENAI_CHAT_MODEL:gpt-5.6-terra}
# Terra supports tool calling through Chat Completions when reasoning is disabled.
langchain4j.open-ai.chat-model.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
langchain4j.open-ai.chat-model.timeout=60s

langchain4j.open-ai.embedding-model.base-url=https://api.openai.com/v1
langchain4j.open-ai.embedding-model.model-name=text-embedding-3-small
langchain4j.open-ai.embedding-model.timeout=60s

# AI observability is part of the conference demo by default. Start the local
# Phoenix collector with `podman-compose up -d phoenix` before generating traces.
app.ai.tracing.enabled=${AI_TRACING_ENABLED:true}
app.ai.tracing.include-content=${AI_TRACING_INCLUDE_CONTENT:true}
app.ai.tracing.annotations.enabled=${AI_TRACING_ANNOTATIONS_ENABLED:true}
app.ai.tracing.phoenix-base-url=${PHOENIX_BASE_URL:`http://localhost:6006`}
app.ai.tracing.phoenix-api-key=${PHOENIX_API_KEY:}

otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:`http://localhost:4317`}
otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
otel.resource.attributes=service.namespace=travel-demo,deployment.environment.name=local,openinference.project.name=swiss-travel-advisor
# Only the purpose-built AI spans are instrumented. Automatic HTTP and JDBC
# tracing are omitted so Phoenix shows AGENT/LLM/TOOL/EMBEDDING/RETRIEVER spans
# instead of redundant transport and SQL wrappers.
